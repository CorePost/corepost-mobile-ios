name: CorePostMobileIOS
options:
  bundleIdPrefix: com.corepost
  deploymentTarget:
    iOS: "18.0"
targets:
  CorePostMobileIOS:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepost.mobileios
        PRODUCT_NAME: CorePost
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CorePost
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      configs:
        Debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    scheme:
      testTargets:
        - CorePostMobileIOSUITests
  CorePostMobileIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CorePostMobileIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepost.mobileios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
